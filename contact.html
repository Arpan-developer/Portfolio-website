<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Arpan</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <a href="index.html" class="logo">
            Arpan
        </a>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="about.html">
                About
            </a>

            <a href="skills.html">
                Skills
            </a>

            <a href="projects.html">
                Projects
            </a>

            <a href="contact.html" class="active">
                Contact
            </a>

        </nav>

        <div class="theme-icon">
            ◐
        </div>

    </header>


    <!-- CONTACT -->

    <main>

        <section class="page-section contact-page">


            <!-- LEFT -->

            <div class="contact-left">

                <p class="section-small">
                    Get In Touch
                </p>

                <h1>
                    Let's Talk
                </h1>

                <p class="contact-description">
                    I'm open to new opportunities, collaborations
                    and exciting projects. Feel free to reach out —
                    I'll get back to you soon.
                </p>


                <div class="contact-info">


                    <div class="info-item">

                        <span>✉</span>

                        <div>

                            <small>
                                Email
                            </small>

                            <p>
                                arpan@example.com
                            </p>

                        </div>

                    </div>


                    <div class="info-item">

                        <span>⌖</span>

                        <div>

                            <small>
                                Location
                            </small>

                            <p>
                                India
                            </p>

                        </div>

                    </div>


                </div>


                <div class="social-links">

                    <a href="#">◉</a>

                    <a href="#">in</a>

                    <a href="#">𝕏</a>

                </div>

            </div>


            <!-- FORM -->

            <div class="contact-form">

                <form>

                    <div class="form-row">


                        <div class="form-group">

                            <label for="name">
                                Name
                            </label>

                            <input
                                type="text"
                                id="name"
                                placeholder="Your name"
                            >

                        </div>


                        <div class="form-group">

                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                placeholder="your@email.com"
                            >

                        </div>


                    </div>


                    <div class="form-group">

                        <label for="message">
                            Message
                        </label>

                        <textarea
                            id="message"
                            placeholder="Your message..."
                        ></textarea>

                    </div>


                    <button type="submit">
                        Send Message
                    </button>

                </form>

            </div>


            <!-- RIGHT -->

            <div class="contact-thanks">

                <p>
                    Thanks for<br>
                    visiting! <span>♥</span>
                </p>

            </div>


        </section>

    </main>

</body>

</html>
